<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Award Stats</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .editable {
            background-color: #f9f9d1; /* Highlight editable cells */
        }
        .total-section {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .highlight-zero {
            color: red;
        }
        .highlight-winner {
            color: green;
            font-weight: bold;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .fixtures-section {
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        .fixtures-list {
            list-style-type: none;
            padding: 0;
        }
        .fixtures-list li {
            margin: 5px 0;
        }
        .no-fixtures {
            color: red;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Award Stats</h1>
      <div class="fixtures-section">
        <h2 id="fixturesHeader"></h2>
        <ul id="fixturesList" class="fixtures-list"></ul>
    </div>
    <!-- Section for displaying total prize money -->
    <div class="total-section">
        <h2>Total Prize Money Won So Far</h2>
        <div id="totalPrizeMoney"></div>
    </div>

    <table id="winningTable">
        <thead>
            <tr>
                <th>Contest</th>
                <th>Reason to Win</th>
                <th>Winner</th>
                <th>Prize Money</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be loaded here dynamically -->
        </tbody>
    </table>
    <!-- Save Changes Button -->
    <button id="saveButton" style="display:none;">Save Changes</button>

    <script>
          // Fetch today's fixtures from the server
             // Fetch today's fixtures from the server
        fetch("/today-fixtures")
            .then(response => response.json()) // Parse JSON response
            .then(data => {
                const fixturesHeader = document.getElementById("fixturesHeader");
                const fixturesList = document.getElementById("fixturesList");

                if (data.fixtures && Array.isArray(data.fixtures) && data.fixtures.length > 0) {
                    // Display today's date
                    fixturesHeader.textContent = `Fixtures for ${data.date}`;
                    
                    // Populate the list with fixture information including match number
                    data.fixtures.forEach(fixture => {
                        const listItem = document.createElement("li");
                        listItem.textContent = `Match ${fixture.Match}: ${fixture.Fixture}`;
                        fixturesList.appendChild(listItem);
                    });
                } else {
                    // Display "No fixtures" message
                    fixturesHeader.textContent = `No Fixtures Scheduled for ${data.date}`;
                    const noFixturesItem = document.createElement("li");
                    noFixturesItem.textContent = "No fixtures available";
                    noFixturesItem.classList.add("no-fixtures");
                    fixturesList.appendChild(noFixturesItem);
                }
            })
            .catch(error => {
                console.error("Error fetching today's fixtures:", error);
                const fixturesHeader = document.getElementById("fixturesHeader");
                fixturesHeader.textContent = "Error fetching today's fixtures";
            });

        // Function to parse URL parameters
        function getURLParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // Check if "edit=true" exists in the URL
        const isEditable = getURLParameter("edit") === "true";
        if (isEditable) {
            document.getElementById("saveButton").style.display = "block"; // Show Save Changes button
        }

        // Fetch the JSON data for winnings from winnings.json
        fetch("/winnings.json")
            .then(response => response.json()) // Parse JSON
            .then(winningsData => {
                const tableBody = document.querySelector("#winningTable tbody");

                // Populate the table dynamically
                winningsData.forEach(entry => {
                    const row = document.createElement("tr");

                    // Create editable or non-editable table cells based on "edit=true"
                    row.innerHTML = `
                        <td contenteditable="${isEditable}" class="${isEditable ? 'editable' : ''}">${entry.Contest}</td>
                        <td contenteditable="${isEditable}" class="${isEditable ? 'editable' : ''}">${entry["Reason to win"]}</td>
                        <td contenteditable="${isEditable}" class="${isEditable ? 'editable' : ''}">${entry.Winner}</td>
                        <td contenteditable="${isEditable}" class="${isEditable ? 'editable' : ''}">${entry["Prize Money"]}</td>
                    `;
                    tableBody.appendChild(row);
                });

                // Fetch the owner details JSON
                const owners = [
                    { "Name": "Karthik", "Contest Win": 2, "Total Prize Money": 0 },
                    { "Name": "Bhushan", "Contest Win": 0, "Total Prize Money": 0 },
                    { "Name": "Shaurabh", "Contest Win": 0, "Total Prize Money": 0 },
                    { "Name": "Mayur", "Contest Win": 0, "Total Prize Money": 0 },
                    { "Name": "Sanjay", "Contest Win": 1, "Total Prize Money": 0 },
                    { "Name": "Kuljeet", "Contest Win": 0, "Total Prize Money": 0 },
                    { "Name": "Sherry", "Contest Win": 0, "Total Prize Money": 0 },
                    { "Name": "Ajay", "Contest Win": 0, "Total Prize Money": 0 }
                ];

                // Calculate total prize money for each owner based on winnings
                owners.forEach(owner => {
                    owner.TotalPrizeMoney = winningsData
                        .filter(entry => entry.Winner === owner.Name)
                        .reduce((sum, entry) => sum + (parseFloat(entry["Prize Money"]) || 0), 0);
                });

                // Sort owners by TotalPrizeMoney in descending order
                owners.sort((a, b) => b.TotalPrizeMoney - a.TotalPrizeMoney);

                // Display total prize money per owner
                const totalPrizeMoneyDiv = document.getElementById("totalPrizeMoney");
                totalPrizeMoneyDiv.innerHTML = owners
                    .map(owner => `<p class="${owner.TotalPrizeMoney === 0 ? 'highlight-zero' : 'highlight-winner'}">${owner.Name}: ₹${owner.TotalPrizeMoney}</p>`)
                    .join("");
            })
            .catch(error => {
                console.error("Error fetching the JSON file:", error);
            });

        // Save Changes: Collect data from the table and send it to the server
        document.getElementById("saveButton").addEventListener("click", () => {
            const tableBody = document.querySelector("#winningTable tbody");
            const rows = tableBody.querySelectorAll("tr");
            const updatedData = [];

            rows.forEach(row => {
                const cells = row.querySelectorAll("td");
                updatedData.push({
                    Contest: cells[0].innerText,
                    "Reason to win": cells[1].innerText,
                    Winner: cells[2].innerText,
                    "Prize Money": cells[3].innerText
                });
            });

            // Send updated data to the server
            fetch("/save-winnings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedData)
            })
            .then(response => {
                if (response.ok) {
                    alert("Changes saved successfully!");
                } else {
                    alert("Failed to save changes.");
                }
            })
            .catch(error => {
                console.error("Error saving changes:", error);
            });
        });
    </script>
</body>
</html>
