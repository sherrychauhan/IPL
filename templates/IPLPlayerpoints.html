<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owners and Players</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Tabs Container */
        .tabs {
            display: flex;
            flex-wrap: nowrap; /* Ensure tabs stay in a single row on larger screens */
            border-bottom: 2px solid #ccc;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-bottom: none;
            margin-right: 5px;
            background-color: #f4f4f4;
            text-align: center;
            flex: 1 1 auto; /* Adjust tab width dynamically */
            box-sizing: border-box;
        }

        .tab.active {
            background-color: #fff;
            font-weight: bold;
            border-top: 2px solid #333;
            border-left: 2px solid #333;
            border-right: 2px solid #333;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .captain {
            background-color: #92D050; /* Green for captain */
        }

        .vice-captain {
            background-color: #FFFF00; /* Yellow for vice-captain */
        }

        .rank-1 {
            background-color: gold; /* Gold for rank 1 */
        }

        .rank-2 {
            background-color: silver; /* Silver for rank 2 */
        }

        .rank-3 {
            background-color: #cd7f32; /* Bronze for rank 3 */
        }

        .fixtures-section {
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        .fixtures-list {
            list-style-type: none;
            padding: 0;
        }
        .fixtures-list li {
            margin: 5px 0;
        }
        .no-fixtures {
            color: red;
            font-weight: bold;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 5px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        .action-panel {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .action-panel h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .action-panel p {
            margin: 0 0 12px 0;
            color: #555;
        }

        .last-updated {
            margin: 0 0 12px 0;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-btn {
            border: 1px solid #333;
            background-color: #333;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .action-btn.secondary {
            background-color: #fff;
            color: #333;
        }

        .action-btn.tertiary {
            background-color: #f4f4f4;
            color: #333;
            border-color: #ccc;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 768px) {
            .tabs {
                overflow-x: auto; /* Enable horizontal scrolling for smaller screens */
                flex-wrap: nowrap; /* Prevent wrapping */
                white-space: nowrap; /* Ensure tabs stay in one row */
            }

            .tab {
                flex: 0 0 calc(33.33% - 10px); /* Show 3 tabs in the visible area on smaller screens */
                margin-right: 5px;
            }
            
            th:nth-child(4), td:nth-child(4) {
                display: none; /* Hide details column on mobile */
            }
        }

        @media (max-width: 480px) {
            body {
                margin: 10px;
            }

            th, td {
                font-size: 12px; /* Reduce table font size for smaller screens */
                padding: 8px;
            }

            .tab {
                padding: 8px; /* Reduce tab padding for smaller screens */
                font-size: 14px; /* Adjust tab font size */
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="fixtures-section">
        <h2 id="fixturesHeader"></h2>
        <ul id="fixturesList" class="fixtures-list"></ul>
    </div>

    <div id="totalRanks">
        <!-- Total points and ranks will be dynamically displayed here -->
    </div>
    <h1>Owners and Players</h1>
    
    <div class="tabs" id="tabs">
        <!-- Tabs will be dynamically added here -->
    </div>
    <div id="contents">
        <!-- Player tables for each owner will be dynamically added here -->
    </div>

    <div class="action-panel">
        <h2>Refresh IPL Points</h2>
        <p>Update latest points and quickly navigate to related views.</p>
        <p id="lastUpdatedInfo" class="last-updated">Last Reloaded At (IST): Fetching...</p>
        <div class="action-buttons">
            <button class="action-btn" onclick="callFlaskScript()">Reload Data</button>
            <button class="action-btn secondary" onclick="window.location.href='playerStats';">Go to Player Stats Page</button>
            <button class="action-btn tertiary" onclick="window.location.href='stats';">Go to Stats Page</button>
        </div>
    </div>

    <!-- Modal for breakdown -->
    <div id="breakdownModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Player Breakdown</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        function formatToIST(utcTimestamp) {
            const date = new Date(utcTimestamp);
            if (Number.isNaN(date.getTime())) {
                return null;
            }

            return date.toLocaleString("en-IN", {
                timeZone: "Asia/Kolkata",
                year: "numeric",
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true,
            });
        }

        async function loadLastUpdatedTimestamp() {
            const lastUpdatedElement = document.getElementById("lastUpdatedInfo");

            try {
                const response = await fetch("player-role-meta");
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const metadata = await response.json();
                const formattedTime = formatToIST(metadata.last_modified_utc);

                if (formattedTime) {
                    lastUpdatedElement.textContent = `Last Reloaded At (IST): ${formattedTime}`;
                } else {
                    lastUpdatedElement.textContent = "Last Reloaded At (IST): Invalid timestamp";
                }
            } catch (error) {
                console.error("Error fetching player file metadata:", error);
                lastUpdatedElement.textContent = "Last Reloaded At (IST): Unavailable";
            }
        }

        loadLastUpdatedTimestamp();

       // Fetch today's fixtures from the server
        fetch("today-fixtures")
            .then(response => response.json()) // Parse JSON response
            .then(data => {
                console.log("Today's Fixtures:", data); // Log the data for debugging   
                const fixturesHeader = document.getElementById("fixturesHeader");
                const fixturesList = document.getElementById("fixturesList");

                if (data.fixtures && Array.isArray(data.fixtures) && data.fixtures.length > 0) {
                    // Display today's date
                    fixturesHeader.textContent = `Fixtures for ${data.date}`;

                    // Populate the list with fixture information including match number
                    data.fixtures.forEach(fixture => {
                        const listItem = document.createElement("li");
                        listItem.textContent = `Match ${fixture.Match}: ${fixture.Fixture}`;
                        fixturesList.appendChild(listItem);
                    });
                } else {
                    // Display "No fixtures" message
                    fixturesHeader.textContent = `No Fixtures Scheduled for ${data.date}`;
                    const noFixturesItem = document.createElement("li");
                    noFixturesItem.textContent = "No fixtures available";
                    noFixturesItem.classList.add("no-fixtures");
                    fixturesList.appendChild(noFixturesItem);
                }
            })
            .catch(error => {
                console.error("Error fetching today's fixtures:", error);
                const fixturesHeader = document.getElementById("fixturesHeader");
                fixturesHeader.textContent = "Error fetching today's fixtures";
            });
        // Fetch JSON from the Python server
        fetch('player_role.json') // Replace with your hosted JSON file path if needed
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(playerData => {
                const tabsContainer = document.getElementById("tabs");
                const contentsContainer = document.getElementById("contents");
                const totalRanksContainer = document.getElementById("totalRanks");

                // Group players by owner
                const groupedData = {};
                playerData.forEach(player => {
                    if (!groupedData[player.owner]) {
                        groupedData[player.owner] = [];
                    }
                    groupedData[player.owner].push(player);
                });

                // Calculate total points for each owner
                const ownerPoints = Object.keys(groupedData).map(owner => {
                    const totalPoints = groupedData[owner].reduce((sum, player) => sum + player.points, 0);
                    return { owner, totalPoints };
                });

                // Sort owners by total points to determine ranks
                ownerPoints.sort((a, b) => b.totalPoints - a.totalPoints);
                ownerPoints.forEach((data, index) => {
                    data.rank = index + 1;
                });

                // Display total points and ranks at the top
                const rankTable = document.createElement("table");
                rankTable.innerHTML = `
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Owner</th>
                            <th>Total Points</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${ownerPoints
                            .map(data => `
                                <tr class="${data.rank === 1 ? 'rank-1' : data.rank === 2 ? 'rank-2' : data.rank === 3 ? 'rank-3' : ''}">
                                    <td>${data.rank}</td>
                                    <td>${data.owner}</td>
                                    <td>${data.totalPoints}</td>
                                </tr>
                            `)
                            .join("")}
                    </tbody>
                `;
                totalRanksContainer.appendChild(rankTable);

                // Create tabs and contents for each owner
                let firstOwner = true;
                for (const owner in groupedData) {
                    // Sort players within each owner: Captain > Vice-Captain > others
                    groupedData[owner].sort((a, b) => {
                        if (a.role.indexOf("Captain") == 0) return -1;
                        if (b.role.indexOf("Captain") == 0) return 1;
                        if (a.role.indexOf("Vice-Captain") == 0) return -1;
                        if (b.role.indexOf("Vice-Captain") == 0) return 1;
                        return 0;
                    });

                    // Create a tab
                    const tab = document.createElement("div");
                    tab.className = `tab ${firstOwner ? "active" : ""}`;
                    tab.textContent = owner;
                    tab.dataset.owner = owner;
                    tabsContainer.appendChild(tab);

                    // Create the content for this owner
                    const content = document.createElement("div");
                    content.className = `content ${firstOwner ? "active" : ""}`;
                    const table = document.createElement("table");
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th>Player Name</th>
                                <th>Points</th>
                                <th>Role</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${groupedData[owner]
                                .map(player => `
                                    <tr class="${player.role.includes('Vice-Captain') ? 'vice-captain' : player.role.includes('Captain') ? 'captain' : ''}">
                                        <td>${player.playerName}</td>
                                        <td><a href="#" onclick="showBreakdown('${player.playerName}', ${JSON.stringify(player.breakdown).replace(/"/g, '&quot;')}); return false;" style="color: inherit; text-decoration: underline;">${player.points}</a></td>
                                        <td>${player.role}</td>
                                        <td>Details</td>
                                    </tr>
                                `)
                                .join("")}
                        </tbody>
                    `;
                    content.appendChild(table);
                    contentsContainer.appendChild(content);

                    firstOwner = false;
                }

                // Handle tab click event
                document.querySelectorAll(".tab").forEach(tab => {
                    tab.addEventListener("click", function () {
                        const owner = this.dataset.owner;

                        // Activate the clicked tab
                        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                        this.classList.add("active");

                        // Show the corresponding content
                        document.querySelectorAll(".content").forEach(c => c.classList.remove("active"));
                        document.querySelectorAll(".content")[Array.from(tabsContainer.children).indexOf(this)].classList.add("active");
                    });
                });
            })
            .catch(error => console.error('Error fetching JSON:', error));

        async function callFlaskScript() {
             try {
                // Send a POST request to the Flask route
                 const response = await fetch('load-points', { method: 'GET' });
                 const result = await response.json(); // Parse JSON response
                // Log the result to the console (optional)
                console.log(result.message);

                // Refresh the page
                location.reload();
            } catch (error) {
                console.error("Error running the script:", error);
            }


        }
        function generateBreakdownHTML(breakdown) {
            if (!breakdown.batting && !breakdown.bowling) return '<p>No stats available</p>';
            
            let html = '<table style="width: 100%; border-collapse: collapse; font-size: 14px;">';
            html += '<thead><tr style="background-color: #f0f0f0;"><th style="border: 1px solid #ddd; padding: 8px;">Category</th><th style="border: 1px solid #ddd; padding: 8px;">Stat</th><th style="border: 1px solid #ddd; padding: 8px;">Count</th><th style="border: 1px solid #ddd; padding: 8px;">Points/Unit</th><th style="border: 1px solid #ddd; padding: 8px;">Total Points</th></tr></thead>';
            html += '<tbody>';
            
            if (breakdown.batting) {
                const battingStats = [
                    { name: 'Total Runs', count: breakdown.batting.TotalRuns, pointsPer: 1 },
                    { name: 'Fours', count: breakdown.batting.Fours, pointsPer: 1 },
                    { name: 'Sixes', count: breakdown.batting.Sixes, pointsPer: 2 },
                    { name: '50+ Runs', count: breakdown.batting.FiftyPlusRuns, pointsPer: 8 },
                    { name: 'Centuries', count: breakdown.batting.Centuries, pointsPer: 16 },
                    { name: 'Catches', count: breakdown.batting.Catches, pointsPer: 8 },
                    { name: 'Stumpings', count: breakdown.batting.Stumpings, pointsPer: 12 }
                ];
                
                battingStats.forEach(stat => {
                    if (stat.count > 0) {
                        html += `<tr>
                            <td style="border: 1px solid #ddd; padding: 8px; font-weight: bold;">Batting</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">${stat.name}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.count}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.pointsPer}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.count * stat.pointsPer}</td>
                        </tr>`;
                    }
                });
                
                html += `<tr style="background-color: #e8f4f8;">
                    <td colspan="4" style="border: 1px solid #ddd; padding: 8px; font-weight: bold; text-align: right;">Total Batting Points:</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold;">${breakdown.batting.BattingPoints}</td>
                </tr>`;
            }
            
            if (breakdown.bowling) {
                const bowlingStats = [
                    { name: 'Wickets', count: breakdown.bowling.Wickets, pointsPer: 25 },
                    { name: 'Maidens', count: breakdown.bowling.Maidens, pointsPer: 12 },
                    { name: '4 Wickets', count: breakdown.bowling.FourWickets, pointsPer: 8 },
                    { name: '5 Wickets', count: breakdown.bowling.FiveWickets, pointsPer: 16 }
                ];
                
                bowlingStats.forEach(stat => {
                    if (stat.count > 0) {
                        html += `<tr>
                            <td style="border: 1px solid #ddd; padding: 8px; font-weight: bold;">Bowling</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">${stat.name}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.count}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.pointsPer}</td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${stat.count * stat.pointsPer}</td>
                        </tr>`;
                    }
                });
                
                html += `<tr style="background-color: #f8e8e8;">
                    <td colspan="4" style="border: 1px solid #ddd; padding: 8px; font-weight: bold; text-align: right;">Total Bowling Points:</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold;">${breakdown.bowling.BowlingPoints}</td>
                </tr>`;
            }
            
            const totalPoints = (breakdown.batting ? breakdown.batting.BattingPoints : 0) + (breakdown.bowling ? breakdown.bowling.BowlingPoints : 0);
            html += `<tr style="background-color: #e8f8e8;">
                <td colspan="4" style="border: 1px solid #ddd; padding: 8px; font-weight: bold; text-align: right;">Combined Points:</td>
                <td style="border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold; color: #2e7d32;">${totalPoints}</td>
            </tr>`;
            
            html += '</tbody></table>';
            return html;
        }

        function showBreakdown(playerName, breakdown) {
            document.getElementById('modalTitle').textContent = `${playerName} - Points Breakdown`;
            document.getElementById('modalBody').innerHTML = generateBreakdownHTML(breakdown);
            document.getElementById('breakdownModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('breakdownModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('breakdownModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

    </script>
</body>
</html>
